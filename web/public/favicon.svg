<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- wukong 站点图标：圆角方块 + 主色渐变 + 信号波纹，与后台品牌标记同一视觉语言 -->
  <defs>
    <linearGradient id="wk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d78e0" />
      <stop offset="100%" stop-color="#3f4aa8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#wk-bg)" />
  <!-- 中心实心点：代表被监控节点 -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" />
  <!-- 两侧对称弧线：代表实时上报的波形 -->
  <path
    d="M20 22a16 16 0 0 0 0 20M44 22a16 16 0 0 1 0 20"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.9"
  />
  <path
    d="M12 15a27 27 0 0 0 0 34M52 15a27 27 0 0 1 0 34"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.45"
  />
</svg>
